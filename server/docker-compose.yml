# v9.65（V2-P2）：一键部署 —— PG16 + 服务端
# 用法：在 server/ 目录执行 docker compose up -d
# 首次：把 AI_API_KEY / LOCAL_TOKEN 填到 .env（或环境变量）
services:
  db:
    image: postgres:16-alpine
    container_name: stock-monitor-db
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${PG_PASSWORD:-stock_pwd}
      POSTGRES_DB: stock_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: stock-monitor-app
    environment:
      DATABASE_URL: postgres://stock:${PG_PASSWORD:-stock_pwd}@db:5432/stock_monitor
      PORT: 8080
      AI_BASE_URL: ${AI_BASE_URL:-https://apihub.agnes-ai.cn/v1}
      AI_MODEL: ${AI_MODEL:-agnes-2.5-flash}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      LOCAL_TOKEN: ${LOCAL_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
